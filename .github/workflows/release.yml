name: release
on:
  push:
    branches: [main]

jobs:
  code:
    uses: repobuddy/.github/.github/workflows/pnpm-verify.yml@v2
    permissions:
      contents: read
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true
      skip-codecov: true

  # Secretless: GITHUB_TOKEN for the version PR, npm trusted publishing (OIDC) to
  # publish. No NPM_TOKEN to rotate or silently expire. The trusted publisher
  # registered at npmjs.com must name THIS file (release.yml), not the reusable
  # workflow it calls.
  release:
    uses: repobuddy/.github/.github/workflows/pnpm-release-changeset-oidc.yml@v2
    needs: code
    # Declaring `permissions:` replaces the default set, so every scope the callee
    # needs must be listed — unlisted ones drop to `none`, not to the default.
    permissions:
      # Mints the OIDC token npm exchanges for short-lived publish credentials.
      id-token: write
      # Lets changesets/action push the version branch and tags.
      contents: write
      # Lets changesets/action open the "version packages" PR.
      pull-requests: write
      # Approves the Version Packages PR's parked pull_request runs, so its required
      # checks report and the PR can merge.
      actions: write
